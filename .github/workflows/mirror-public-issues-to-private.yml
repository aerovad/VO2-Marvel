name: Mirror public issues to private repo

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: mirror-public-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Copy issue to private repo
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPO: aerovad/aerovad-vo2-marvel
      MIRROR_TOKEN: ${{ secrets.PRIVATE_REPO_ISSUE_TOKEN }}
    steps:
      - name: Require private repo token
        shell: bash
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing required repository secret: PRIVATE_REPO_ISSUE_TOKEN" >&2
            echo "Create a fine-grained token with Issues read/write access to $PRIVATE_REPO and store it as a secret in this public repo." >&2
            exit 1
          fi

      - name: Create matching issue in private repo
        shell: python
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["MIRROR_TOKEN"]
          private_repo = os.environ["PRIVATE_REPO"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          event_path = os.environ["GITHUB_EVENT_PATH"]

          with open(event_path, "r", encoding="utf-8") as f:
            event = json.load(f)

          issue = event["issue"]
          title = issue.get("title") or ""
          body = issue.get("body") or ""
          labels = issue.get("labels") or []
          label_names = [label["name"] for label in labels if label.get("name")]

          def request(method, path, payload=None, ok=(200, 201, 204, 404)):
            data = None
            headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
            }
            if payload is not None:
              data = json.dumps(payload).encode("utf-8")
              headers["Content-Type"] = "application/json"
            req = urllib.request.Request(f"{api}{path}", data=data, headers=headers, method=method)
            try:
              with urllib.request.urlopen(req) as resp:
                text = resp.read().decode("utf-8")
                return resp.status, json.loads(text) if text else None
            except urllib.error.HTTPError as e:
              text = e.read().decode("utf-8", errors="replace")
              if e.code in ok:
                return e.code, json.loads(text) if text else None
              print(f"GitHub API error {method} {path}: HTTP {e.code}: {text}", file=sys.stderr)
              raise

          # Recreate missing labels in the private repo before assigning them.
          for label in labels:
            name = label.get("name")
            if not name:
              continue
            encoded = urllib.parse.quote(name, safe="")
            status, _ = request("GET", f"/repos/{private_repo}/labels/{encoded}")
            if status == 404:
              request("POST", f"/repos/{private_repo}/labels", {
                "name": name,
                "color": label.get("color") or "ededed",
                "description": label.get("description") or "",
              })

          payload = {
            "title": title,
            "body": body,
          }
          if label_names:
            payload["labels"] = label_names

          status, created = request("POST", f"/repos/{private_repo}/issues", payload, ok=(201,))
          print(f"Mirrored public issue #{issue['number']} to {created['html_url']}")
